name: Create Tag and Release on Version Change

# Bump __version__ in plugin/__init__.py (the only place of the version,
# configure.ac reads it from there) and push to master: this tags the commit
# with the version and creates a GitHub release with the commits since the
# previous tag. An existing tag is never touched.

on:
  push:
    paths:
      - plugin/__init__.py
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag_and_release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from file
        id: get_version
        run: |
          VERSION=$(grep -oP '(?<=^__version__ = ")[^"]+' plugin/__init__.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.get_version.outputs.version }}$"; then
            echo "Tag ${{ steps.get_version.outputs.version }} already exists."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.get_version.outputs.version }}
          git push origin ${{ steps.get_version.outputs.version }}

      - name: Generate changelog
        id: changelog
        if: steps.check_tag.outputs.skip != 'true'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude "${{ steps.get_version.outputs.version }}" 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -n 10)
          else
            echo "Previous tag: $LAST_TAG"
            CHANGELOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges -n 10)
          fi

          # Escape only % to avoid GitHub Actions output issues
          CHANGELOG="${CHANGELOG//'%'/'%25'}"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Changes in this release
            ${{ steps.changelog.outputs.changelog }}
